# ECEN 433 - Lab 4
#
# Detector configuration for the ROBOT.
#
# COPY THIS FILE AND NAME THE COPY AFTER YOUR ROBOT - config/DUCKIEBOT_NAME.yaml.
# If roslaunch cannot find your param file, this is almost always why.
#
# YOUR SAMPLE-IMAGE THRESHOLDS MAY NOT WORK HERE.

image_topic: "camera_node/image/compressed"

img_size: [320, 240]  # TODO
top_cutoff: 0.4       # TODO

colors:
  WHITE:
    low:  [45, 0, 160]        # TODO
    high: [180, 85, 255]  # TODO

  YELLOW:
    low:  [15, 65, 0]        # TODO
    high: [45, 255, 255]  # TODO

  RED:
    low_1:  [0, 85, 85]        # TODO
    high_1: [10, 255, 255]  # TODO
    low_2:  [170, 85, 85]        # TODO
    high_2: [180, 255, 255]  # TODO

dilation_kernel_size: 3  # TODO
erode_iterations: 2      # TODO
dilate_iterations: 4     # TODO

canny_thresholds: [50, 100]  # TODO
canny_aperture_size: 3
hough:
  threshold: 5        # TODO
  min_line_length: 5  # TODO
  max_line_gap: 5     # TODO

normal_probe_px: 2

# Leave this false.
fake_lane_filter_switch: false
