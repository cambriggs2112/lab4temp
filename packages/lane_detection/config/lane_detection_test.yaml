# ECEN 433 - Lab 4
#
# Detector configuration for TEST mode - the saved images replayed by
# camera_sim. Loaded by lane_detection.launch when test:=true.
#
# Your robot gets its own param file in Part V. The two files have the same
# keys and different numbers, which is the whole point: the node never changes.

image_topic: "camera_node/image/compressed"

img_size: [320, 240]  # TODO
top_cutoff: 0.4       # TODO

colors:
  WHITE:
    low:  [0, 0, 170]        # TODO
    high: [180, 85, 255]  # TODO

  YELLOW:
    low:  [20, 85, 85]        # TODO
    high: [40, 255, 255]  # TODO

  RED:
    low_1:  [0, 85, 85]        # TODO
    high_1: [10, 255, 255]  # TODO
    low_2:  [170, 85, 85]        # TODO
    high_2: [180, 255, 255]  # TODO

dilation_kernel_size: 3  # TODO
erode_iterations: 2      # TODO
dilate_iterations: 3     # TODO

canny_thresholds: [50, 100]  # TODO
canny_aperture_size: 3
hough:
  threshold: 10        # TODO
  min_line_length: 15  # TODO
  max_line_gap: 7     # TODO

normal_probe_px: 2

# Leave this false.
fake_lane_filter_switch: false
